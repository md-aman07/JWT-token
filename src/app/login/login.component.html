<div class="login-container">
    <form (ngSubmit)="onSubmit()" #loginForm="ngForm">

        <h2>Login</h2>
        <h3 (click)="singup()">Sing Up</h3>

        <!-- Email Field -->
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" class="form-control" required email
                [(ngModel)]="loginData.email" #email="ngModel" />
            <div class="error" *ngIf="email.invalid && email.touched">
                Valid email is required
            </div>
        </div>

        <!-- Password Field -->
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" class="form-control" required minlength="6"
                [(ngModel)]="loginData.password" #password="ngModel" />
            <div class="error" *ngIf="password.invalid && password.touched">
                Password must be at least 6 characters
            </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" [disabled]="loginForm.invalid" class="btn btn-primary">
            Login
        </button>

    </form>
</div>
